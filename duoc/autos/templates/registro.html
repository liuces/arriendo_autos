{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coches Santiago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="{% static 'imgs/car.jpg' %}" width="35px" alt="">
                Coches Santiago</a>
        </div>
        </div>
    </nav>
    <form id="form_registro">
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="nombre" class="form-label">Nombre</label>
            <input type="text" class="form-control" id="nombre">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="apellido" class="form-label">Apellido</label>
            <input type="text" class="form-control" id="apellido">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="text" class="form-control" id="usuario">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" aria-describedby="emailHelp">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="text" class="form-control" id="contrasena">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="repetir_contrasena" class="form-label">Repetir Contraseña</label>
            <input type="text" class="form-control" id="repetir_contrasena">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="fecha_nacimiento" class="form-label">Fecha de Nacimiento</label>
            <input type="date" class="form-control" id="fecha_nacimiento">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="direccion" class="form-label">Direccion</label>
            <input type="text" class="form-control" id="direccion">
        </div>
        <button type="submit" class="btn btn-primary">Iniciar sesion</button>
        <button type="reset" class="btn btn-secondary">
            Limpiar
        </button>
    </form>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">  
</script>

<script>
    const formulario = document.getElementById('form_registro');

    const nombreinput = document.getElementById('nombre');
    const apellidoinput = document.getElementById('apellido');
    const usuarioinput = document.getElementById('usuario');
    const emailinput = document.getElementById('email');
    const contrasenainput = document.getElementById('contrasena');
    const repetir_contrasenainput = document.getElementById('repetir_contrasena');
    const fecha_nacimientoinput = document.getElementById('fecha_nacimiento');
    const direccioninput = document.getElementById('direccion');

    formulario.addEventListener('submit', function (event) {
        event.preventDefault(); 

        if (nombreinput.value === '' || apellidoinput.value === '' || usuarioinput.value === '' || emailinput.value === '' || contrasenainput.value === '' || repetir_contrasenainput.value === '' || fecha_nacimientoinput.value === '' || direccioninput.value === '') {
            alert('Ninguno de los campos tiene que estar vacio');
            return;
        }
        else if (contrasenainput.value !== repetir_contrasenainput.value) {
            alert('Las contraseñas no coinciden');
            return;
        }

        if (contrasenainput.value.length < 8 || contrasenainput.value.length > 16) {
            alert('La contraseña debe tener al menos 8 y hasta 16 caracteres');
            return;
        }

        alert('Usted se a registrado correctamente');
        formulario.submit();
    });

</script>
</html>
