<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coches Santiago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="imgs/car.jpg" width="35px" alt="">
                Coches Santiago</a>
        </div>
        </div>
    </nav>

    <form id="form_login">
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="usuario" class="form-label">Usuario</label>
            <input type="username" class="form-control" id="usuario" aria-describedby="emailHelp">
        </div>
        <div class="mb-3 col-10 col-sm-6 col-md-4 ">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" class="form-control" id="contrasena">
        </div>
        <button type="submit" class="btn btn-primary">Iniciar sesion</button>
        <a href="{% url 'registro' %}" class="btn btn-secondary">Registrarse</a>
        <a href="{% url 'recuperar_contrasena' %}" class="btn btn-secondary">Recuperar contraseña</a>
    </form>
</body>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" crossorigin="anonymous">
    </script>

<script>
    const formulariologin = document.getElementById('form_login');

    const usuarioinput = document.getElementById('usuario');
    const contrasenainput = document.getElementById('contrasena');


    formulariologin.addEventListener('submit', function (event) {
        event.preventDefault();

        if (usuarioinput.value === '' || contrasenainput.value === '') {
            alert('Ninguno de los campos tiene que estar vacio');
            return;
        }

        if (contrasenainput.value.length < 8 || contrasenainput.value.length > 16) {
            alert('La contraseña debe tener al menos 8 y hasta 16 caracteres');
            return;
        }

        alert('Usted a iniciado sesión correctamente');
        formulariologin.submit();
    });

</script>

</html>
