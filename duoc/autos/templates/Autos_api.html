{% load static %}
<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Coches Santiago</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'inicio' %}">
                <img src="{% static 'imgs/car.jpg' %}" width="35px" alt="">
                Coches Santiago</a>
        </div>
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'login' %}">
                Iniciar sesion</a>
        </div>
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'registro' %}">
                Registrarse</a>
        </div>
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'modificar' %}">
                Modificar cuenta</a>
        </div>
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'listado_automoviles' %}">
                Listado de Automóviles</a>
        </div>
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'listado_automoviles_api' %}">
                Listado de Automóviles+</a>
        </div>
    </nav>
    {% block contenido %}
    <h1>Listado de Automóviles</h1>
    <div class="container">
        <div class="row">
            <table class="table">
                    <tr>
                        <th scope="col">Patente</th>
                        <th scope="col">Nombre</th>
                        <th scope="col">Descripción</th>
                        <th scope="col">Precio</th>
                        <th scope="col">Imagen</th>
                    </tr>
                </thead>
                <tbody>
                    {% for marca in marcas %}
                    <tr>
                        <th scope="row">{{ marca.name }}</th>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    {% endblock %}



    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>

        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js" integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</body>

</html>
